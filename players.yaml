# In-Houser players
# rank: 1 (beginner) to 5 (best), half stars allowed (e.g. 2.5)
# role: optional, locks a new player to top | jungle | mid | adc | support
# ban: optional, a role this player never gets (top | jungle | mid | adc | support)
# random_champion: optional, true = gets a random champion that fits their role
# playing: ticked for tonight's game
# say: optional, how the announcer should pronounce the name (used by npm run voice)
# style: optional, a short description of how the player plays (shown when hovering the player)
# main: optional, favourite champion (e.g. Leona); their fighter in the reveal is styled after it
players:
  - name: Maas
    rank: 1
    role: support
    playing: true
    say: Mahss
    style: "Dedicated support: Leona in every recorded game. Lives in the enemy's
      face with tons of crowd control and the best vision score in the lobby,
      setting up fights for the team. Weak points: a one-champion pool (Leona
      only), and even for a support low damage with almost no tower or objective
      involvement; dies a lot (7.8 per game). (12 games)"
    main: Leona
